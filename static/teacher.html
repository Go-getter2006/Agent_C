<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学情总览</title>
<style>
:root { --bg: #f6f7f9; --panel: #fff; --ink: #1d232b; --muted: #66707c; --line: #e3e6ea; --accent: #2f6fde; --soft: #eef1f5; }
@media (prefers-color-scheme: dark) { :root { --bg: #14171b; --panel: #1c2026; --ink: #e6e9ee; --muted: #9aa3ae; --line: #2c323a; --accent: #6c9cf0; --soft: #232831; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
header { padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
h1 { font-size: 17px; margin: 0; }
.wrap { padding: 16px 20px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: 13px; }
.mini { display: inline-flex; gap: 2px; vertical-align: middle; }
.mini span { width: 16px; height: 16px; border-radius: 3px; background: var(--soft); position: relative; overflow: hidden; }
.mini span i { position: absolute; left: 0; bottom: 0; width: 100%; background: var(--accent); }
input, button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
button { cursor: pointer; }
a { color: var(--accent); }
.muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>学情总览 <span class="muted">（学生 × 知识点）</span></h1>
  <div>
    <input id="token" type="password" placeholder="教师口令（TEACHER_TOKEN）">
    <button id="load">刷新</button>
    <span class="muted">导出：</span>
    <a href="#" data-t="episodes">回合</a> · <a href="#" data-t="turns">发言</a> · <a href="#" data-t="diagnoses">诊断</a> ·
    <a href="#" data-t="responses">作答</a> · <a href="#" data-t="ablation">先验消融</a>
  </div>
</header>
<div class="wrap">
  <p class="muted">五个小方块依次是：判断有错、定位问题、解释原因与触发条件、修复并说明、独立完成变式题；填充高度表示达到该步的概率。</p>
  <table>
    <thead><tr><th>学生</th><th>知识点</th><th>掌握等级</th><th>独立掌握概率</th><th>能力估计 θ（±标准差）</th><th>五维画像</th><th>最弱一步</th><th>讨论回合</th><th>重复提问</th><th>平均投入指数</th></tr></thead>
    <tbody id="rows"><tr><td colspan="10" class="muted">加载中…</td></tr></tbody>
  </table>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
function tok() { try { return localStorage.getItem("ctutor_token") || ""; } catch (e) { return ""; } }
function td(text) { const c = document.createElement("td"); c.textContent = text; return c; }
async function load() {
  const t = $("token").value || tok();
  try { localStorage.setItem("ctutor_token", t); } catch (e) {}
  const res = await fetch("/api/teacher/overview", { headers: { "X-Teacher-Token": t } });
  const data = await res.json();
  const body = $("rows"); body.innerHTML = "";
  if (!res.ok) { const tr = document.createElement("tr"); tr.appendChild(td(data.error || "加载失败")); body.appendChild(tr); return; }
  if (!data.rows.length) { const tr = document.createElement("tr"); tr.appendChild(td("还没有数据。")); body.appendChild(tr); return; }
  data.rows.forEach((r) => {
    const tr = document.createElement("tr");
    tr.appendChild(td(r.student_id)); tr.appendChild(td(r.kp_name)); tr.appendChild(td(r.level));
    tr.appendChild(td(r.p_mastered === null ? "—" : Math.round(r.p_mastered * 100) + "%"));
    tr.appendChild(td(r.mu === null ? "—" : r.mu.toFixed(2) + " ± " + r.sd.toFixed(2)));
    const cell = document.createElement("td"), mini = document.createElement("span"); mini.className = "mini";
    (r.profile || []).forEach((s) => { const b = document.createElement("span"); b.title = s.name + " " + Math.round(s.p * 100) + "%";
      const f = document.createElement("i"); f.style.height = Math.round(s.p * 100) + "%"; b.appendChild(f); mini.appendChild(b); });
    cell.appendChild(mini); tr.appendChild(cell);
    tr.appendChild(td(r.weakest_step || "—")); tr.appendChild(td(r.n_episodes)); tr.appendChild(td(r.n_reask));
    tr.appendChild(td(r.mean_engagement === null ? "—" : r.mean_engagement.toFixed(2)));
    body.appendChild(tr);
  });
}
document.querySelectorAll("a[data-t]").forEach((a) => a.addEventListener("click", (e) => {
  e.preventDefault(); const t = $("token").value || tok();
  window.location = "/api/export/" + a.dataset.t + ".csv?token=" + encodeURIComponent(t);
}));
$("token").value = tok();
$("load").addEventListener("click", load);
load();
</script>
</body>
</html>
